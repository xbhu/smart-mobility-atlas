title: "Smart Mobility Research Atlas"
description: "A structured research atlas of the Smart Mobility Lab at Penn State"

baseurl: ""
url: "https://atlas.mobilitypsu.com"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# Collections
collections:
  papers:
    output: true
    permalink: /papers/:name/

footer_content: "Smart Mobility Lab @ Penn State | Dr. Xianbiao Hu"

# Default layouts
defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
